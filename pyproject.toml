[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "natural-trading"
version = "0.1.0"
description = "Rule-based, astronomically-timed swing trading system (lunar/solstice cadence) over IBKR."
requires-python = ">=3.11"
dependencies = [
    "ib_async>=1.0.1",
    "ephem>=4.1.5",
    "anthropic>=0.39.0",
    "httpx>=0.27.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "black>=24.0.0",
    "mypy>=1.11.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["preliminary"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "preliminary"

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
ignore_missing_imports = true
exclude = ["preliminary", "build", "\\.venv"]
# Third-party packages reached transitively (pytest's optional numpy-aware `approx()`
# typing under TYPE_CHECKING, ib_async's internals, etc.) pull in numpy's bundled .pyi
# stubs, which use PEP 695 `type` statements requiring python_version >= 3.12 to parse.
# That mismatch with this project's python_version=3.11 target raises a *blocking* syntax
# error that aborts the whole run before any real file is checked — and per-module
# `follow_imports = "skip"` overrides do NOT suppress it (verified: the blocking parse
# happens before per-module config is consulted). Setting follow_imports=skip globally
# does suppress it: natural_trading's own files are still fully checked because they are
# explicit command-line/exclude-discovered sources (follow_imports only governs modules
# reached purely via import, not the specific files mypy was told to check).
follow_imports = "skip"
